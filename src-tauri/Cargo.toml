[package]
name = "renpy-studio"
version = "0.1.0"
description = "Visual no-code IDE for Ren'Py visual novels"
authors = ["RenPy Studio"]
edition = "2021"
rust-version = "1.77"

[features]
default = []
# Console subsystem for headless commands (`--new`, `--import`, `--export`, `--lint`).
cli = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v7", "serde"] }
notify = "8"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "io-util"] }
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
similar = "2"
zip = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"

